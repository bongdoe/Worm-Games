  <body>
    <div id="app" class="app" data-state="loading">
      <header class="hud">
        <div class="brand" aria-hidden="true">WORM</div>
        <dl class="stats">
          <div class="stat">
            <dt>Score</dt>
            <dd id="score" aria-live="polite">0</dd>
          </div>
          <div class="stat">
            <dt>Best</dt>
            <dd id="best">0</dd>
          </div>
          <div class="stat">
            <dt>Length</dt>
            <dd id="length">5</dd>
          </div>
        </dl>
        <div class="actions">
          <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause" title="Pause (P)" disabled>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" /></svg>
          </button>
          <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute (M)">
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" />
              <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" />
              <path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <main id="stage" class="stage" tabindex="-1" aria-label="Game arena">
        <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

        <section id="overlay-loading" class="overlay is-visible" aria-live="polite">
          <div class="card">
            <div class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <p id="loading-text" class="overlay-sub">Loading</p>
          </div>
        </section>

        <section id="overlay-menu" class="overlay" aria-labelledby="menu-title" inert>
          <div class="card">
            <h1 id="menu-title" class="title">WORM</h1>
            <p class="press blink">Press start</p>
            <button id="btn-start" class="btn" type="button" data-primary>Start</button>
            <p class="hint hint-keys"><kbd>Arrows</kbd> / <kbd>WASD</kbd> steer &middot; <kbd>Space</kbd> pause &middot; <kbd>M</kbd> mute</p>
            <p class="hint hint-touch">Swipe on the arena or use the pad</p>
          </div>
        </section>

        <section id="overlay-pause" class="overlay" aria-labelledby="pause-title" inert>
          <div class="card">
            <h2 id="pause-title" class="title title-sm">PAUSED</h2>
            <div class="btn-row">
              <button id="btn-resume" class="btn" type="button" data-primary>Resume</button>
              <button id="btn-restart-pause" class="btn ghost" type="button">Restart</button>
            </div>
          </div>
        </section>

        <section id="overlay-over" class="overlay" aria-labelledby="over-title" inert>
          <div class="card">
            <h2 id="over-title" class="title title-sm danger">GAME OVER</h2>
            <div class="final">
              <span class="final-label">Final score</span>
              <span id="final-score" class="final-score">0</span>
            </div>
            <p id="new-best" class="badge" hidden>New best!</p>
            <p id="final-meta" class="final-meta">Length 5</p>
            <button id="btn-restart" class="btn" type="button" data-primary>Restart</button>
            <p class="hint hint-keys">or press <kbd>Space</kbd></p>
          </div>
        </section>
      </main>

      <footer class="controls">
        <div class="dpad" role="group" aria-label="Direction pad">
          <button type="button" data-dir="up" aria-label="Up" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6l7 9H5z" /></svg></button>
          <button type="button" data-dir="left" aria-label="Left" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12l9-7v14z" /></svg></button>
          <button type="button" data-dir="right" aria-label="Right" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 12l-9 7V5z" /></svg></button>
          <button type="button" data-dir="down" aria-label="Down" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18l-7-9h14z" /></svg></button>
        </div>
        <p class="key-hint"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> to steer &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> mute</p>
      </footer>
    </div>
